[tox]
envlist =
    py314
    ctrace-py314
    xdist-py314
    py315
    ctrace-py315
    xdist-py315

[pytest]
norecursedirs = .*
                dist
                experiments

[testenv]
passenv = PYTHONPATH
setenv =
    TESTMON_DATAFILE=.testmondata.tox
    ctrace: TESTMON_CORE=ctrace
commands = pytest -c tox.ini --tb=native -v -s {posargs:tests}
deps =
    pytest==9.0.1
    pytest-mock
    coverage<8
    xdist: pytest-xdist

[gh-actions]
python =
    3.14: py314, ctrace-py314, xdist-py314
    3.15: py315, ctrace-py315, xdist-py315
